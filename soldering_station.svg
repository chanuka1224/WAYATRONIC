<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="16" fill="#0d1527"/>
  <!-- Station Base -->
  <rect x="60" y="110" width="170" height="190" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2.5"/>
  <rect x="80" y="135" width="130" height="55" rx="6" fill="#021c29" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="90" y="152" font-family="monospace" font-size="8" fill="#38bdf8">TEMP SET: 350°C</text>
  <text x="90" y="180" font-family="monospace" font-size="28" font-weight="bold" fill="#00f2fe">352°C</text>
  <!-- Buttons -->
  <circle cx="105" cy="225" r="14" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="105" y="230" font-family="sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">▲</text>
  <circle cx="145" cy="225" r="14" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="145" y="230" font-family="sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">▼</text>
  <circle cx="185" cy="225" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="185" y="229" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">SET</text>

  <!-- Iron connector socket -->
  <circle cx="145" cy="270" r="12" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="140" cy="268" r="2" fill="#f8fafc"/>
  <circle cx="150" cy="268" r="2" fill="#f8fafc"/>
  <circle cx="145" cy="274" r="2" fill="#f8fafc"/>

  <!-- Soldering Iron Stand with Iron -->
  <rect x="250" y="190" width="90" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Brass wool sponge cup -->
  <ellipse cx="295" cy="265" rx="28" ry="16" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
  <!-- Iron Barrel resting diagonally -->
  <line x1="220" y1="90" x2="295" y2="240" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <line x1="220" y1="90" x2="260" y2="170" stroke="#0284c7" stroke-width="16" stroke-linecap="round"/> <!-- Grip -->
  <!-- Soldering Tip (Glowing slightly) -->
  <polygon points="295,240 305,255 292,258" fill="#e2e8f0" stroke="#f59e0b" stroke-width="1.5"/>

  <text x="145" y="127" font-family="sans-serif" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle">WAYATRONIC WT-936D PRO</text>
</svg>