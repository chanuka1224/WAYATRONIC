<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="scopeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#031b26"/>
      <stop offset="100%" stop-color="#010d14"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f2fe" stroke-width="0.3" stroke-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#scopeBg)"/>
  
  <!-- Oscilloscope Main Body Chassis -->
  <rect x="40" y="80" width="320" height="240" rx="14" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <!-- Top Handle -->
  <path d="M 120 80 C 120 60, 280 60, 280 80" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Screen Area -->
  <rect x="55" y="100" width="200" height="150" rx="6" fill="url(#screenGrad)" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="55" y="100" width="200" height="150" fill="url(#grid)"/>

  <!-- Waveform CH1 Yellow Sine -->
  <path d="M 55 175 Q 80 120, 105 175 T 155 175 T 205 175 T 255 175" fill="none" stroke="#eab308" stroke-width="2.2"/>
  <!-- Waveform CH2 Cyan Digital Pulse -->
  <path d="M 55 210 L 85 210 L 85 190 L 125 190 L 125 210 L 165 210 L 165 190 L 205 190 L 205 210 L 245 210 L 245 190 L 255 190" fill="none" stroke="#00f2fe" stroke-width="2"/>

  <!-- Screen Readouts -->
  <text x="62" y="115" font-family="monospace" font-size="9" fill="#eab308" font-weight="bold">CH1: 2.00V  1.00kHz</text>
  <text x="62" y="128" font-family="monospace" font-size="9" fill="#00f2fe" font-weight="bold">CH2: 3.30V  Duty 50%</text>
  <text x="180" y="115" font-family="monospace" font-size="8" fill="#94a3b8">1.00GSa/s</text>

  <!-- Right Control Panel: Knobs and Buttons -->
  <rect x="268" y="100" width="78" height="150" rx="6" fill="#0f172a"/>
  <!-- Knobs -->
  <circle cx="288" cy="125" r="12" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="288" cy="125" r="5" fill="#eab308"/>
  <text x="288" y="145" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">VOLTS</text>

  <circle cx="328" cy="125" r="12" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="328" cy="125" r="5" fill="#38bdf8"/>
  <text x="328" y="145" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">TIME</text>

  <!-- Buttons matrix -->
  <rect x="278" y="156" width="14" height="8" rx="2" fill="#64748b"/>
  <rect x="298" y="156" width="14" height="8" rx="2" fill="#64748b"/>
  <rect x="318" y="156" width="14" height="8" rx="2" fill="#22c55e"/> <!-- RUN/STOP green -->

  <rect x="278" y="170" width="14" height="8" rx="2" fill="#64748b"/>
  <rect x="298" y="170" width="14" height="8" rx="2" fill="#64748b"/>
  <rect x="318" y="170" width="14" height="8" rx="2" fill="#64748b"/>

  <!-- Brand Plate -->
  <text x="65" y="278" font-family="sans-serif" font-size="12" font-weight="900" fill="#f8fafc" letter-spacing="1">WAYATRONIC</text>
  <text x="65" y="292" font-family="sans-serif" font-size="9" font-weight="700" fill="#00f2fe">DSO-2104X 100MHz 4CH</text>

  <!-- BNC Channels Terminals at Bottom -->
  <!-- CH1 -->
  <circle cx="180" cy="285" r="9" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <circle cx="180" cy="285" r="4" fill="#eab308"/>
  <text x="180" y="303" font-family="sans-serif" font-size="7" fill="#eab308" text-anchor="middle">CH 1</text>
  <!-- CH2 -->
  <circle cx="215" cy="285" r="9" fill="#1e293b" stroke="#00f2fe" stroke-width="2"/>
  <circle cx="215" cy="285" r="4" fill="#00f2fe"/>
  <text x="215" y="303" font-family="sans-serif" font-size="7" fill="#00f2fe" text-anchor="middle">CH 2</text>
  <!-- CH3 -->
  <circle cx="250" cy="285" r="9" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <circle cx="250" cy="285" r="4" fill="#ec4899"/>
  <text x="250" y="303" font-family="sans-serif" font-size="7" fill="#ec4899" text-anchor="middle">CH 3</text>
  <!-- CH4 -->
  <circle cx="285" cy="285" r="9" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <circle cx="285" cy="285" r="4" fill="#22c55e"/>
  <text x="285" y="303" font-family="sans-serif" font-size="7" fill="#22c55e" text-anchor="middle">CH 4</text>
  <!-- EXT TRIG -->
  <circle cx="320" cy="285" r="9" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="320" cy="285" r="4" fill="#94a3b8"/>
  <text x="320" y="303" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">TRIG</text>
</svg>