<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="16" fill="#0b1426"/>
  <!-- Heavy Duty Aluminum Case Opened -->
  <rect x="50" y="80" width="300" height="240" rx="14" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="65" y="95" width="270" height="210" rx="8" fill="#1e293b"/>
  <!-- Cutout Foam Inserts with Tools Inside -->
  <!-- Cutout 1: Multimeter -->
  <rect x="80" y="115" width="70" height="110" rx="10" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <rect x="90" y="125" width="50" height="25" rx="3" fill="#052e16"/>
  <text x="115" y="142" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="middle">0.00</text>
  <!-- Cutout 2: Logic Probe -->
  <rect x="170" y="115" width="20" height="100" rx="6" fill="#0284c7"/>
  <!-- Cutout 3: Wire Stripper / Crimper -->
  <path d="M 215 120 L 235 155 L 210 200 L 225 210 L 245 160 L 230 120 Z" fill="#ef4444"/>
  <!-- Cutout 4: Component Assortment Box -->
  <rect x="255" y="115" width="65" height="85" rx="6" fill="#334155" stroke="#64748b"/>
  <line x1="255" y1="145" x2="320" y2="145" stroke="#64748b"/>
  <line x1="255" y1="175" x2="320" y2="175" stroke="#64748b"/>
  <line x1="287" y1="115" x2="287" y2="200" stroke="#64748b"/>
  <!-- Cutout 5: Test Lead Coils -->
  <circle cx="115" cy="265" r="22" fill="none" stroke="#ef4444" stroke-width="5"/>
  <circle cx="170" cy="265" r="22" fill="none" stroke="#000000" stroke-width="5"/>
  <circle cx="225" cy="265" r="22" fill="none" stroke="#eab308" stroke-width="5"/>
  <!-- Solder Tube -->
  <rect x="260" y="235" width="60" height="15" rx="4" fill="#94a3b8"/>
  <text x="290" y="246" font-family="sans-serif" font-size="7" fill="#0f172a" text-anchor="middle" font-weight="bold">60/40 SOLDER</text>
  <!-- Latches on Top -->
  <rect x="110" y="72" width="30" height="12" rx="3" fill="#94a3b8"/>
  <rect x="260" y="72" width="30" height="12" rx="3" fill="#94a3b8"/>
  <!-- Handle -->
  <path d="M 160 72 C 160 55, 240 55, 240 72" fill="none" stroke="#94a3b8" stroke-width="6"/>
  <!-- Brand text -->
  <text x="200" y="325" font-family="sans-serif" font-size="10" font-weight="800" fill="#f8fafc" text-anchor="middle">WAYATRONIC MASTER ELECTRONIC TEST KIT WT-TK99</text>
</svg>