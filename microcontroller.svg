<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="16" fill="#091322"/>
  <!-- Dark Blue / Black PCB Board (ESP32-S3 / Arduino Dual) -->
  <rect x="80" y="80" width="240" height="240" rx="12" fill="#064e3b" stroke="#047857" stroke-width="2.5"/>
  <!-- Gold Plated PCB traces -->
  <path d="M 100 100 L 140 100 L 160 140 L 160 180" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.7"/>
  <path d="M 300 100 L 260 100 L 240 140 L 240 180" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.7"/>
  <path d="M 100 300 L 150 300 L 170 260 L 170 220" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.7"/>
  <!-- Main MCU Chip with Metal RF Shield -->
  <rect x="140" y="140" width="120" height="120" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="185" font-family="monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">ESP32-S3</text>
  <text x="200" y="202" font-family="monospace" font-size="9" fill="#00f2fe" text-anchor="middle">Dual 240MHz</text>
  <text x="200" y="218" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">WiFi 4 + BLE 5.0</text>
  <!-- USB-C Port -->
  <rect x="175" y="72" width="50" height="18" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <!-- Pin Headers Left and Right -->
  <g fill="#0f172a" stroke="#fbbf24" stroke-width="1">
    <rect x="85" y="95" width="12" height="10" rx="2"/>
    <rect x="85" y="115" width="12" height="10" rx="2"/>
    <rect x="85" y="135" width="12" height="10" rx="2"/>
    <rect x="85" y="155" width="12" height="10" rx="2"/>
    <rect x="85" y="175" width="12" height="10" rx="2"/>
    <rect x="85" y="195" width="12" height="10" rx="2"/>
    <rect x="85" y="215" width="12" height="10" rx="2"/>
    <rect x="85" y="235" width="12" height="10" rx="2"/>
    <rect x="85" y="255" width="12" height="10" rx="2"/>
    <rect x="85" y="275" width="12" height="10" rx="2"/>

    <rect x="303" y="95" width="12" height="10" rx="2"/>
    <rect x="303" y="115" width="12" height="10" rx="2"/>
    <rect x="303" y="135" width="12" height="10" rx="2"/>
    <rect x="303" y="155" width="12" height="10" rx="2"/>
    <rect x="303" y="175" width="12" height="10" rx="2"/>
    <rect x="303" y="195" width="12" height="10" rx="2"/>
    <rect x="303" y="215" width="12" height="10" rx="2"/>
    <rect x="303" y="235" width="12" height="10" rx="2"/>
    <rect x="303" y="255" width="12" height="10" rx="2"/>
    <rect x="303" y="275" width="12" height="10" rx="2"/>
  </g>
  <!-- Power LED RGB -->
  <circle cx="115" cy="115" r="4" fill="#22c55e"/>
  <circle cx="115" cy="135" r="4" fill="#00f2fe"/>
  <!-- Silk Screen branding -->
  <text x="200" y="295" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">WAYATRONIC DEV-BOARD V3</text>
</svg>