<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dmmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071b2f"/>
      <stop offset="100%" stop-color="#002b4d"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="25%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#dmmBg)"/>
  <!-- DMM Rubber Holster -->
  <rect x="110" y="40" width="180" height="320" rx="28" fill="url(#bodyGrad)" stroke="#78350f" stroke-width="3"/>
  <!-- DMM Main Dark Casing -->
  <rect x="122" y="52" width="156" height="296" rx="18" fill="#1e293b"/>
  <!-- LCD Display -->
  <rect x="135" y="68" width="130" height="75" rx="8" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="145" y="86" font-family="monospace" font-size="10" fill="#38bdf8">AUTO TRUE-RMS</text>
  <text x="145" y="125" font-family="monospace" font-size="34" font-weight="bold" fill="#00f2fe" filter="url(#glow)">230.4</text>
  <text x="248" y="125" font-family="monospace" font-size="20" font-weight="bold" fill="#38bdf8">V~</text>
  <text x="145" y="137" font-family="monospace" font-size="8" fill="#94a3b8">50.02 Hz  |  MAX 231.8</text>
  <!-- Brand text on body -->
  <text x="200" y="162" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">WAYATRONIC</text>
  <text x="200" y="174" font-family="sans-serif" font-size="8" font-weight="600" fill="#fbbf24" text-anchor="middle">WT-6000 PRO</text>
  <!-- Rotary Dial -->
  <circle cx="200" cy="225" r="42" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <circle cx="200" cy="225" r="32" fill="#1e293b"/>
  <!-- Dial pointer -->
  <line x1="200" y1="225" x2="200" y2="198" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <!-- Dial Range Labels -->
  <text x="200" y="177" font-family="sans-serif" font-size="7" fill="#fbbf24" text-anchor="middle">OFF</text>
  <text x="238" y="200" font-family="sans-serif" font-size="7" fill="#f8fafc">V~</text>
  <text x="246" y="228" font-family="sans-serif" font-size="7" fill="#f8fafc">V⎓</text>
  <text x="238" y="255" font-family="sans-serif" font-size="7" fill="#f8fafc">Ω / ·))</text>
  <text x="150" y="255" font-family="sans-serif" font-size="7" fill="#f8fafc">Hz%</text>
  <text x="150" y="228" font-family="sans-serif" font-size="7" fill="#f8fafc">mA</text>
  <text x="156" y="200" font-family="sans-serif" font-size="7" fill="#ef4444">10A</text>
  <!-- Input Terminals Jack Jacks -->
  <circle cx="145" cy="315" r="11" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <circle cx="145" cy="315" r="5" fill="#ef4444"/>
  <text x="145" y="336" font-family="sans-serif" font-size="6" fill="#ef4444" text-anchor="middle">10A</text>

  <circle cx="180" cy="315" r="11" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <circle cx="180" cy="315" r="5" fill="#ef4444"/>
  <text x="180" y="336" font-family="sans-serif" font-size="6" fill="#ef4444" text-anchor="middle">mA μA</text>

  <circle cx="218" cy="315" r="11" fill="#1e293b" stroke="#000000" stroke-width="2"/>
  <circle cx="218" cy="315" r="5" fill="#000000"/>
  <text x="218" y="336" font-family="sans-serif" font-size="6" fill="#94a3b8" text-anchor="middle">COM</text>

  <circle cx="255" cy="315" r="11" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <circle cx="255" cy="315" r="5" fill="#ef4444"/>
  <text x="255" y="336" font-family="sans-serif" font-size="6" fill="#ef4444" text-anchor="middle">VΩHz</text>
</svg>