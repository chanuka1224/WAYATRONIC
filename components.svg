<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="16" fill="#08111e"/>
  <!-- Assortment of Resistors, Capacitors, ICs -->
  <!-- IC DIP-16 in Center -->
  <rect x="150" y="80" width="100" height="180" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="200" cy="95" r="8" fill="#1e293b"/>
  <text x="200" y="165" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">NE555P / 74HC</text>
  <text x="200" y="180" font-family="monospace" font-size="8" fill="#00f2fe" text-anchor="middle">TI PRECISION</text>
  <!-- IC Pins -->
  <g fill="#cbd5e1">
    <rect x="132" y="105" width="18" height="6" rx="2"/><rect x="250" y="105" width="18" height="6" rx="2"/>
    <rect x="132" y="125" width="18" height="6" rx="2"/><rect x="250" y="125" width="18" height="6" rx="2"/>
    <rect x="132" y="145" width="18" height="6" rx="2"/><rect x="250" y="145" width="18" height="6" rx="2"/>
    <rect x="132" y="165" width="18" height="6" rx="2"/><rect x="250" y="165" width="18" height="6" rx="2"/>
    <rect x="132" y="185" width="18" height="6" rx="2"/><rect x="250" y="185" width="18" height="6" rx="2"/>
    <rect x="132" y="205" width="18" height="6" rx="2"/><rect x="250" y="205" width="18" height="6" rx="2"/>
    <rect x="132" y="225" width="18" height="6" rx="2"/><rect x="250" y="225" width="18" height="6" rx="2"/>
  </g>
  <!-- Electrolytic Capacitor -->
  <rect x="65" y="140" width="40" height="70" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="65" y="140" width="8" height="70" fill="#94a3b8"/> <!-- Negative stripe -->
  <text x="69" y="180" font-family="sans-serif" font-size="9" fill="#0f172a" font-weight="bold">-</text>
  <!-- Leads -->
  <line x1="75" y1="210" x2="75" y2="245" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="95" y1="210" x2="95" y2="255" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="85" y="130" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="middle">470μF 50V</text>

  <!-- Resistor 1/4W with Color Bands -->
  <line x1="80" y1="310" x2="320" y2="310" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="140" y="295" width="120" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <!-- Color Bands: Brown, Black, Red, Gold = 1k 5% -->
  <rect x="160" y="295" width="8" height="30" fill="#78350f"/>
  <rect x="180" y="295" width="8" height="30" fill="#000000"/>
  <rect x="200" y="295" width="8" height="30" fill="#dc2626"/>
  <rect x="230" y="295" width="8" height="30" fill="#f59e0b"/>

  <!-- TO-220 Transistor -->
  <rect x="285" y="150" width="50" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <path d="M 285 150 L 285 130 L 335 130 L 335 150 Z" fill="#94a3b8"/>
  <circle cx="310" cy="140" r="4" fill="#0f172a"/>
  <line x1="295" y1="205" x2="295" y2="245" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="310" y1="205" x2="310" y2="245" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="325" y1="205" x2="325" y2="245" stroke="#cbd5e1" stroke-width="2"/>
  <text x="310" y="180" font-family="monospace" font-size="7" fill="#f8fafc" text-anchor="middle">LM317T</text>

  <text x="200" y="360" font-family="sans-serif" font-size="10" font-weight="800" fill="#f8fafc" text-anchor="middle">WAYATRONIC ACTIVE &amp; PASSIVE COMPONENTS</text>
</svg>