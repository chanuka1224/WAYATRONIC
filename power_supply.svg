<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="16" fill="#0c1322"/>
  <rect x="50" y="90" width="300" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2.5"/>
  <!-- Two Large Digital Displays (Voltage & Current) -->
  <rect x="70" y="115" width="120" height="65" rx="6" fill="#051923" stroke="#00f2fe" stroke-width="1.2"/>
  <text x="80" y="132" font-family="monospace" font-size="8" fill="#38bdf8">VOLTAGE C.V.</text>
  <text x="80" y="166" font-family="monospace" font-size="28" font-weight="bold" fill="#00f2fe">30.00</text>
  <text x="172" y="166" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">V</text>

  <rect x="210" y="115" width="120" height="65" rx="6" fill="#051923" stroke="#ef4444" stroke-width="1.2"/>
  <text x="220" y="132" font-family="monospace" font-size="8" fill="#f87171">CURRENT C.C.</text>
  <text x="220" y="166" font-family="monospace" font-size="28" font-weight="bold" fill="#ef4444">05.00</text>
  <text x="312" y="166" font-family="monospace" font-size="14" font-weight="bold" fill="#f87171">A</text>

  <!-- Adjustment Knobs (Coarse & Fine) -->
  <circle cx="100" cy="215" r="16" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="100" cy="215" r="4" fill="#00f2fe"/>
  <text x="100" y="242" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">VOLT COARSE</text>

  <circle cx="150" cy="215" r="12" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="150" cy="215" r="3" fill="#00f2fe"/>
  <text x="150" y="240" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">FINE</text>

  <circle cx="250" cy="215" r="16" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="250" cy="215" r="4" fill="#ef4444"/>
  <text x="250" y="242" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">AMP COARSE</text>

  <circle cx="300" cy="215" r="12" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="300" cy="215" r="3" fill="#ef4444"/>
  <text x="300" y="240" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">FINE</text>

  <!-- Binding Posts: Positive (Red), GND (Green), Negative (Black) -->
  <circle cx="140" cy="275" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <text x="140" y="297" font-family="sans-serif" font-size="8" fill="#ef4444" text-anchor="middle">+</text>

  <circle cx="200" cy="275" r="10" fill="#16a34a" stroke="#166534" stroke-width="2"/>
  <text x="200" y="297" font-family="sans-serif" font-size="8" fill="#22c55e" text-anchor="middle">GND</text>

  <circle cx="260" cy="275" r="10" fill="#1e293b" stroke="#000000" stroke-width="3"/>
  <text x="260" y="297" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">-</text>

  <!-- Brand Plate -->
  <text x="70" y="105" font-family="sans-serif" font-size="9" font-weight="800" fill="#f8fafc">WAYATRONIC WT-3005D DC POWER SUPPLY 30V 5A</text>
</svg>