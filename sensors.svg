<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="16" fill="#0c1524"/>
  <!-- Ultrasonic Distance Sensor Module (HC-SR04 / IMU combo) -->
  <rect x="70" y="130" width="260" height="130" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Transducer Emitter & Receiver Cylinders -->
  <circle cx="130" cy="195" r="45" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="130" cy="195" r="30" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="130" cy="195" r="14" fill="#1e293b"/>
  <text x="130" y="200" font-family="monospace" font-size="12" font-weight="bold" fill="#00f2fe" text-anchor="middle">T</text>

  <circle cx="270" cy="195" r="45" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="270" cy="195" r="30" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="270" cy="195" r="14" fill="#1e293b"/>
  <text x="270" y="200" font-family="monospace" font-size="12" font-weight="bold" fill="#00f2fe" text-anchor="middle">R</text>

  <!-- Crystal Oscillator in Middle -->
  <rect x="188" y="165" width="24" height="40" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="188" font-family="monospace" font-size="6" fill="#0f172a" text-anchor="middle">4MHz</text>

  <!-- 4-Pin Header at Bottom -->
  <rect x="160" y="250" width="80" height="20" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <circle cx="170" cy="260" r="3" fill="#fbbf24"/>
  <circle cx="190" cy="260" r="3" fill="#fbbf24"/>
  <circle cx="210" cy="260" r="3" fill="#fbbf24"/>
  <circle cx="230" cy="260" r="3" fill="#fbbf24"/>
  <text x="200" y="285" font-family="monospace" font-size="7" fill="#f8fafc" text-anchor="middle">VCC  TRIG  ECHO  GND</text>

  <!-- Ultrasonic sound waves illustration -->
  <path d="M 290 150 A 60 60 0 0 1 330 195" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M 305 135 A 80 80 0 0 1 355 195" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <text x="200" y="115" font-family="sans-serif" font-size="10" font-weight="800" fill="#f8fafc" text-anchor="middle">WAYATRONIC PRECISION ULTRASONIC / IMU SENSOR</text>
</svg>