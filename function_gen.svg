<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="16" fill="#091223"/>
  <rect x="45" y="90" width="310" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2.5"/>
  <!-- Screen with Arbitrary / Sine waveform -->
  <rect x="65" y="115" width="170" height="95" rx="6" fill="#041f2d" stroke="#00f2fe" stroke-width="1.5"/>
  <path d="M 75 162 Q 95 130, 115 162 T 155 162 T 195 162 T 225 162" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
  <text x="75" y="132" font-family="monospace" font-size="9" fill="#38bdf8">DDS ARBITRARY GEN</text>
  <text x="75" y="195" font-family="monospace" font-size="16" font-weight="bold" fill="#00f2fe">25.000,000 MHz</text>
  <text x="75" y="205" font-family="monospace" font-size="8" fill="#94a3b8">Ampl: 5.00Vpp | Offset: 0.0V</text>
  <!-- Waveform Selector Buttons -->
  <rect x="250" y="115" width="35" height="18" rx="3" fill="#334155"/><text x="267" y="128" font-family="sans-serif" font-size="8" fill="#f8fafc" text-anchor="middle">~ SINE</text>
  <rect x="295" y="115" width="45" height="18" rx="3" fill="#334155"/><text x="317" y="128" font-family="sans-serif" font-size="8" fill="#f8fafc" text-anchor="middle">⎍ SQUARE</text>
  <rect x="250" y="140" width="35" height="18" rx="3" fill="#334155"/><text x="267" y="153" font-family="sans-serif" font-size="8" fill="#f8fafc" text-anchor="middle">▲ RAMP</text>
  <rect x="295" y="140" width="45" height="18" rx="3" fill="#334155"/><text x="317" y="153" font-family="sans-serif" font-size="8" fill="#f8fafc" text-anchor="middle">ARB</text>
  <!-- Numeric / Rotary control -->
  <circle cx="295" cy="190" r="18" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="295" cy="190" r="5" fill="#38bdf8"/>
  <!-- Channels Output BNC -->
  <circle cx="120" cy="265" r="12" fill="#1e293b" stroke="#eab308" stroke-width="2.5"/>
  <text x="120" y="292" font-family="sans-serif" font-size="8" font-weight="bold" fill="#eab308" text-anchor="middle">CH 1 OUT</text>
  <circle cx="200" cy="265" r="12" fill="#1e293b" stroke="#00f2fe" stroke-width="2.5"/>
  <text x="200" y="292" font-family="sans-serif" font-size="8" font-weight="bold" fill="#00f2fe" text-anchor="middle">CH 2 OUT</text>
  <circle cx="280" cy="265" r="12" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="280" y="292" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">SYNC / MOD</text>
  <text x="65" y="105" font-family="sans-serif" font-size="9" font-weight="800" fill="#f8fafc">WAYATRONIC WT-FG25M DUAL DDS SIGNAL GENERATOR</text>
</svg>