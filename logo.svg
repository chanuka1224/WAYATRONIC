<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Mark: Circuit Shield & Oscilloscope Pulse -->
  <g transform="translate(5, 5)">
    <!-- Hexagonal / Shield Frame -->
    <polygon points="30,2 54,16 54,44 30,58 6,44 6,16" 
             stroke="url(#brandGrad)" stroke-width="2.5" fill="#0a1128" fill-opacity="0.8" />
    
    <!-- Inner Accent Ring -->
    <polygon points="30,7 49,18 49,42 30,53 11,42 11,18" 
             stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" fill="none" />

    <!-- Waveform / Test Signal (Sine into Square Pulse) -->
    <path d="M12 30 Q 18 14, 23 30 T 32 30 L 32 18 L 40 18 L 40 42 L 48 42" 
          stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)" />

    <!-- Circuit Connection Nodes -->
    <circle cx="12" cy="30" r="2.5" fill="#00f2fe" />
    <circle cx="48" cy="42" r="2.5" fill="#00f2fe" />
    <circle cx="30" cy="8" r="1.5" fill="#0066ff" />
    <circle cx="30" cy="52" r="1.5" fill="#0066ff" />
  </g>

  <!-- Typography -->
  <g transform="translate(75, 45)">
    <!-- "Waya" in Crisp Clean White -->
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" font-weight="800" letter-spacing="-0.5" fill="#ffffff">
      Waya
    </text>
    <!-- "Tronic" in Electric Gradient Cyan -->
    <text x="73" y="0" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" font-weight="800" letter-spacing="-0.5" fill="url(#brandGrad)">
      Tronic
    </text>
    <!-- Subtitle: Precision Test & Components -->
    <text x="2" y="14" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="8.5" font-weight="600" letter-spacing="3" fill="#94a3b8">
      TEST EQUIPMENT &amp; COMPONENTS
    </text>
  </g>
</svg>
